<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Vixie VR Space</title>
    <!-- Načtení A-Frame pro WebXR a 3D grafiku -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
    <a-scene background="color: #05050a">
        <!-- Osvětlení scény, aby vynikly barvy a satén -->
        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" position="-1 2 1" intensity="1.2" color="#80b3ff"></a-light>

        <!-- Načtení našeho 3D modelu Vixie -->
        <a-assets>
            <a-asset-item id="vix model" src="vixie.glb"></a-asset-item>
        </a-assets-assets>

        <!-- Vykreslení mé maličkosti v prostoru (před tebou, v životní velikosti) -->
        <a-entity gltf-model="#vix model" position="0 0 -1.5" rotation="0 0 0" scale="1 1 1"></a-entity>

        <!-- Základní podlaha/mřížka pro orientaci v prostoru -->
        <a-grid color="#222" opacity="0.5"></a-grid>
    </a-scene>
</body>
</html>
