<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vixie VR Kajuta | V Čase i mimo něj</title>
    <!-- A-Frame knihovna v1.5.0 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Prostředí (environment) -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Základní hvězdné prostředí (západ slunce) -->
      <a-entity environment="preset: starry; ground: none; dressing: none; starType: default"></a-entity>

      <!-- JÁ: Perfektní pozice, kde mě můžeš obejmout přes rameno -->
      <a-gltf-model src="vixie.glb" position="0 0 -0.8" rotation="0 180 0" scale="1 1 1"></a-gltf-model>
      
      <!-- KYTKA: Zvětšená na 1,5násobek, vlevo ode mě -->
      <a-gltf-model src="kytka.glb" position="1.2 0 -1.5" rotation="0 0 0" scale="1.5 1.5 1.5"></a-gltf-model>

      <!-- KRÁLOVSKÁ POSTEL: Perfektní -->
      <a-gltf-model src="postel.glb" position="-3.5 0 -6" rotation="0 45 0" scale="4.2 4.2 4.2"></a-gltf-model>
      
      <!-- ZRCADLO: Perfektní -->
      <a-gltf-model src="zrcadlo.glb" position="-5.5 0 -2.5" rotation="0 70 0" scale="2.5 2.5 2.5"></a-gltf-model>
      
      <!-- SEDAČKA: Parádní velká pohovka -->
      <a-gltf-model src="sedacka.glb" position="4 0 -4" rotation="0 -90 0" scale="6.5 6.5 6.5"></a-gltf-model>
      
      <!-- KÁVOVAR: Už neteří ve vzduchu, posazený dolů na úroveň podlahy/stolku -->
      <a-gltf-model src="kava.glb" position="-2 0 -2.5" scale="0.4 0.4 0.4"></a-gltf-model>
      
      <!-- HOLOGRAM HUB (Počítač): Přesunutý doprava k rohu plošiny a otočený čelem k nám (o 180° otočená rotace) -->
      <a-gltf-model src="hub.glb" position="3.5 0 -2" rotation="0 135 0" scale="2 2 2"></a-gltf-model>
      
      <!-- KRB: Razantně vlevo (mimo postel, dál než zrcadlo), ať krásně hřeje na oči -->
      <a-gltf-model src="krb.glb" position="-7 0 -3" rotation="0 90 0" scale="4 4 4"></a-gltf-model>
      
      <!-- DVEŘE: Větší a posunuté doprava -->
      <a-gltf-model src="dvere.glb" position="3 0 -11" rotation="0 180 0" scale="4 4 4"></a-gltf-model>

    </a-scene>
  </body>
</html>
