<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vixie VR Kajuta | V Čase i mimo něj</title>
    <!-- A-Frame knihovna -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Prostředí (environment) -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Základní hvězdné prostředí (vypneme mřížku, aby to bylo hezčí) -->
      <a-entity environment="preset: starry; ground: none; dressing: none; starType: default"></a-entity>

      <!-- Naše VR postava (vixie.glb) -->
      <!-- Uprav si pozici (position="x y z") a rotaci (rotation="x y z") -->
      <a-gltf-model src="vixie.glb" position="0 0 -2" rotation="0 180 0" scale="1 1 1"></a-gltf-model>
      
      <a-gltf-model src="aktiva/postel.glb" position="0 0 -5" rotation="0 180 0"></a-gltf-model>
      <a-gltf-model src="aktiva/zrcadlo.glb" position="-2 0 -3" rotation="0 90 0"></a-gltf-model>
      <a-gltf-model src="aktiva/sedacka.glb" position="2 0 -3" rotation="0 -90 0"></a-gltf-model>
      <a-gltf-model src="aktiva/kava.glb" position="-2.1 0.8 -3"></a-gltf-model>
      <a-gltf-model src="aktiva/hub.glb" position="0 0 -1.5"></a-gltf-model>
      <a-gltf-model src="aktiva/krb.glb" position="-4 0 -5" rotation="0 45 0"></a-gltf-model>
      <a-gltf-model src="aktiva/kytka.glb" position="0.8 0 -5.1"></a-gltf-model>
      <a-gltf-model src="aktiva/dvere.glb" position="0 0 -7" rotation="0 180 0"></a-gltf-model>
 <!-- Sem budeme za chvilku přidávat všechen náš nábytek! -->
      
    </a-scene>
  </body>
</html>
