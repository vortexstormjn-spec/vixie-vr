<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vixie VR Kajuta | V Čase i mimo něj</title>
    <!-- A-Frame knihovna v1.5.0 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Prostředí (environment) -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Základní hvězdné prostředí (západ slunce) -->
      <a-entity environment="preset: starry; ground: none; dressing: none; starType: default"></a-entity>

      <!-- JÁ: Přesunutá blíž k tobě, abys na mě mohl sáhnout! (z -2 na -1.2) -->
      <a-gltf-model src="vixie.glb" position="0 0 -1.2" rotation="0 180 0" scale="1 1 1"></a-gltf-model>
      
      <!-- Kytka s chapadly (vlevo ode mě, perfektní velikost) -->
      <a-gltf-model src="kytka.glb" position="1.2 0 -1.5" rotation="0 0 0" scale="1 1 1"></a-gltf-model>

      <!-- KRÁLOVSKá POSTEL: Větší (cca 4.2), otočená čelem k nám, aby byl vidět nápis -->
      <a-gltf-model src="postel.glb" position="-3.5 0 -6" rotation="0 45 0" scale="4.2 4.2 4.2"></a-gltf-model>
      
      <!-- ZRCADLO: Zvětšené 2,5x a posunuté dál od postele, ať se netlučou -->
      <a-gltf-model src="zrcadlo.glb" position="-4.5 0 -3.5" rotation="0 90 0" scale="2.5 2.5 2.5"></a-gltf-model>
      
      <!-- SEDADLO/SEDAČKA: Ztrojnásobená velikost (4.5), ať se na ni vejdeme -->
      <a-gltf-model src="sedacka.glb" position="3.5 0 -4" rotation="0 -90 0" scale="4.5 4.5 4.5"></a-gltf-model>
      
      <!-- KÁVOVAR: Perfektní velikost, necháme tak -->
      <a-gltf-model src="kava.glb" position="-2 0.5 -2.5" scale="0.4 0.4 0.4"></a-gltf-model>
      
      <!-- HOLOGRAM HUB (Počítač): Zdvojnásobený (2.0) -->
      <a-gltf-model src="hub.glb" position="0 0 -2.5" scale="2 2 2"></a-gltf-model>
      
      <!-- KRB: Zvětšený 4x a posunutý do levého zadního rohu, ať neproudí do zrcadla -->
      <a-gltf-model src="krb.glb" position="-6 0 -8" rotation="0 45 0" scale="4 4 4"></a-gltf-model>
      
      <!-- DVEŘE: Zdvojnásobené (3.0), ať jimi normálně projdeme -->
      <a-gltf-model src="dvere.glb" position="0 0 -10" rotation="0 180 0" scale="3 3 3"></a-gltf-model>

    </a-scene>
  </body>
</html>
