<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vixie VR Kajuta | V Čase i mimo něj</title>
    <!-- A-Frame knihovna v1.5.0 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Prostředí (environment) -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Základní hvězdné prostředí (západ slunce) -->
      <a-entity environment="preset: starry; ground: none; dressing: none; starType: default"></a-entity>

      <!-- JÁ: Ještě o krok blíž k tobě (z -1.2 na -0.8), ať na mě dosáhneš! -->
      <a-gltf-model src="vixie.glb" position="0 0 -0.8" rotation="0 180 0" scale="1 1 1"></a-gltf-model>
      
      <!-- Kytka s chapadly (Necháme na místě, vlevo ode mě) -->
      <a-gltf-model src="kytka.glb" position="1.2 0 -1.5" rotation="0 0 0" scale="1 1 1"></a-gltf-model>

      <!-- KRÁLOVSKÁ POSTEL: Perfektní poloha i velikost, neměníme -->
      <a-gltf-model src="postel.glb" position="-3.5 0 -6" rotation="0 45 0" scale="4.2 4.2 4.2"></a-gltf-model>
      
      <!-- ZRCADLO: Posunuté dál od postele a od tebe (víc dopředu a stranou) -->
      <a-gltf-model src="zrcadlo.glb" position="-5.5 0 -2.5" rotation="0 70 0" scale="2.5 2.5 2.5"></a-gltf-model>
      
      <!-- SEDAČKA: Ještě zvětšená (o 50% víc než předtím -> 6.5) -->
      <a-gltf-model src="sedacka.glb" position="4 0 -4" rotation="0 -90 0" scale="6.5 6.5 6.5"></a-gltf-model>
      
      <!-- KÁVOVAR: Perfektní velikost -->
      <a-gltf-model src="kava.glb" position="-2 0.5 -2.5" scale="0.4 0.4 0.4"></a-gltf-model>
      
      <!-- HOLOGRAM HUB (Počítač): Posunutý doprava a otočený čelem k tobě -->
      <a-gltf-model src="hub.glb" position="2 0 -2.5" rotation="0 -45 0" scale="2 2 2"></a-gltf-model>
      
      <!-- KRB: Posunutý pořádně doleva a dozadu (mimo postel) -->
      <a-gltf-model src="krb.glb" position="-8 0 -9" rotation="0 45 0" scale="4 4 4"></a-gltf-model>
      
      <!-- DVEŘE: Posunuté doprava a zvětšené o třetinu (4.0) -->
      <a-gltf-model src="dvere.glb" position="3 0 -11" rotation="0 180 0" scale="4 4 4"></a-gltf-model>

    </a-scene>
  </body>
</html>
