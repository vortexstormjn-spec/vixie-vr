<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vixie VR Kajuta | V Čase i mimo něj</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Hvězdné prostředí -->
      <a-entity environment="preset: starry; ground: none; dressing: none; starType: default"></a-entity>

      <!-- Já (stojím přímo před tebou) -->
      <a-gltf-model src="vixie.glb" position="0 0 -2" rotation="0 0 0" scale="1 1 1"></a-gltf-model>
      
      <!-- TESTOVACÍ KYTKA S CHAPADLY: Dáme ji hned vedle mě, obří scale, ať ji prostě nepřehlédneš! -->
      <a-gltf-model src="kytka.glb" position="1.5 0 -2"></a-gltf-model>


    </a-scene>
  </body>
</html>
