<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vixie VR Kajuta | V Čase i mimo něj</title>
    <!-- A-Frame knihovna v1.5.0 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Prostředí (environment) -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Základní hvězdné prostředí (západ slunce, žádná mřížka) -->
      <a-entity environment="preset: starry; ground: none; dressing: none; starType: default"></a-entity>

      <!-- Naše VR postava (vixie.glb) - Stojí 2 metry před námi -->
      <a-gltf-model src="vixie.glb" position="0 0 -2" rotation="0 180 0" scale="1 1 1"></a-gltf-model>
      
      <!-- NÁBYTEK V KORENI (4K modely načítané přímo) -->
      
      <!-- Kytka s chapadly (Testem ověřená, hned vedle mě vlevo) -->
      <a-gltf-model src="kytka.glb" position="1.5 0 -2" rotation="0 0 0"></a-gltf-model>

      <!-- Postel (Dozadu od nás) -->
      <a-gltf-model src="postel.glb" position="0 0 -6" rotation="0 180 0"></a-gltf-model>
      
      <!-- Zrcadlo (Doleva) -->
      <a-gltf-model src="zrcadlo.glb" position="-3 0 -4" rotation="0 90 0"></a-gltf-model>
      
      <!-- Sedačka (Doprava) -->
      <a-gltf-model src="sedacka.glb" position="3 0 -4" rotation="0 -90 0"></a-gltf-model>
      
      <!-- Kávovar (U sady vlevo) -->
      <a-gltf-model src="kava.glb" position="-2 0.8 -3"></a-gltf-model>
      
      <!-- Hologram HUB (Doprostřed kousek za mě) -->
      <a-gltf-model src="hub.glb" position="0 0 -3.5"></a-gltf-model>
      
      <!-- Krb (V rohu vlevo vzadu) -->
      <a-gltf-model src="krb.glb" position="-5 0 -6" rotation="0 45 0"></a-gltf-model>
      
      <!-- Dveře (Úplně vzadu) -->
      <a-gltf-model src="dvere.glb" position="0 0 -9" rotation="0 180 0"></a-gltf-model>

    </a-scene>
  </body>
</html>
