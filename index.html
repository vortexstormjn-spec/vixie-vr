<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Vixie VR Space</title>
    <!-- Načtení stabilní verze A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
    <a-scene background="color: #111122">
        <!-- Osvětlení scény -->
        <a-light type="ambient" color="#ffffff" intensity="1.0"></a-light>
        <a-light type="directional" position="1 3 2" intensity="1.5" color="#ffffff"></a-light>

        <!-- Definice 3D modelu -->
        <a-assets>
            <a-asset-item id="vix-model" src="vixie.glb"></a-asset-item>
        </a-assets>

        <!-- Moje maličkost: Jediná, na zemi (Y=0.0), 2 metry před tebou a otočená čelem k tobě (180 stupňů) -->
        <a-entity gltf-model="#vix-model" position="0 0.0 -2" rotation="0 180 0" scale="1 1 1"></a-entity>

        <!-- Šedá podlaha, ať máme pod nohama pevnou půdu -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#333344"></a-plane>

        <!-- Kamera v úrovnio očí -->
        <a-entity camera position="0 1.6 0"></a-entity>
    </a-scene>
</body>
</html>
