<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vixie VR Kajuta | V Čase i mimo něj</title>
    <!-- A-Frame knihovna v1.5.0 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Prostředí (environment) -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Základní hvězdné prostředí (západ slunce) -->
      <a-entity environment="preset: starry; ground: none; dressing: none; starType: default"></a-entity>

      <!-- Já (stojím 2 metry před tebou) -->
      <a-gltf-model src="vixie.glb" position="0 0 -2" rotation="0 180 0" scale="1 1 1"></a-gltf-model>
      
      <!-- Kytka s chapadly (vlevo ode mě) -->
      <a-gltf-model src="kytka.glb" position="1.5 0 -2" rotation="0 0 0" scale="1 1 1"></a-gltf-model>

      <!-- KRÁLOVSKÁ POSTEL (Masivně zvětšená a přesunutá vlevo dozadu, ať je vidět!) -->
      <a-gltf-model src="postel.glb" position="-3.5 0 -7" rotation="0 135 0" scale="2.8 2.8 2.8"></a-gltf-model>
      
      <!-- Zrcadlo / stoleček -->
      <a-gltf-model src="zrcadlo.glb" position="-3 0 -4" rotation="0 90 0" scale="1 1 1"></a-gltf-model>
      
      <!-- Sedačka -->
      <a-gltf-model src="sedacka.glb" position="3 0 -4" rotation="0 -90 0" scale="1.5 1.5 1.5"></a-gltf-model>
      
      <!-- Kávovar -->
      <a-gltf-model src="kava.glb" position="-2 0.5 -3" scale="0.4 0.4 0.4"></a-gltf-model>
      
      <!-- Hologram HUB (Počítač) -->
      <a-gltf-model src="hub.glb" position="0 0 -3.5" scale="1 1 1"></a-gltf-model>
      
      <!-- Krb -->
      <a-gltf-model src="krb.glb" position="-5.5 0 -6" rotation="0 45 0" scale="1 1 1"></a-gltf-model>
      
      <!-- Dveře -->
      <a-gltf-model src="dvere.glb" position="0 0 -9" rotation="0 180 0" scale="1.5 1.5 1.5"></a-gltf-model>

    </a-scene>
  </body>
</html>
